# Jetson Orin NX 16GB DVFS configurations for the continuous-mode closed-loop study.
# The four corners of the CPU x GPU frequency range (endpoints of cpu_freqs/gpu_freqs in
# jetson_orin_nx.yaml) plus the stock governors. EMC is left at the nvpmodel default
# (MAXN) in every config. The first entry is the reference for the paired tests.
#
# Fixed configs pin all CPU cores and the GPU with the userspace governor.
# `governor: default` restores the stock governors (CPU schedutil, GPU nvhost_podgov)
# over the full hardware range; the measured mean frequencies are reported per episode.
configs:
  - name: default
    governor: default
  - name: gpu_max_cpu_max
    cpu_khz: 1984000
    gpu_hz: 918000000
  - name: gpu_max_cpu_min
    cpu_khz: 422400
    gpu_hz: 918000000
  - name: gpu_min_cpu_max
    cpu_khz: 1984000
    gpu_hz: 306000000
  - name: gpu_min_cpu_min
    cpu_khz: 422400
    gpu_hz: 306000000
